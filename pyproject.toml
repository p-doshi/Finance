[project]
name = "portfolio-pipeline"
version = "0.1.0"
description = "Risk-aware portfolio construction and monitoring pipeline with a manual execution gate (no brokerage API trading)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "fastapi>=0.117",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "statsmodels>=0.14",
    "ruff>=0.17",
    "quantstats>=0.0.86",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "SIM"]
ignore = ["E501"]  # line length handled by judgment, not a hard gate, for docstring-heavy research code
